name: Build & Release IPK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  lint:
    name: Shell Script Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            src/qmodem-failover.sh \
            src/wan-checker.sh \
            src/switcher.sh \
            src/notify.sh \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045
          shellcheck \
            src/qmodem-failover.init \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045

  build:
    name: Build (${{ matrix.target }}-${{ matrix.subtarget }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            subtarget: 64
            sdk_url: https://openwrt.org

          - target: meson
            subtarget: generic
            sdk_url: https://openwrt.org

          - target: armvirt
            subtarget: 64
            sdk_url: https://openwrt.org

          - target: ramips
            subtarget: mt7621
            sdk_url: https://openwrt.org

          - target: ath79
            subtarget: generic
            sdk_url: https://openwrt.org

          - target: mediatek
            subtarget: mt7622
            sdk_url: https://openwrt.org

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            python3 \
            wget \
            curl

      - name: Download and extract SDK
        run: |
          wget -q --show-progress \
            "${{ matrix.sdk_url }}" \
            -O sdk.tar.xz
          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm sdk.tar.xz
          echo "=== Struktur Direktori SDK ==="
          ls sdk/

      - name: Copy plugin into SDK packages
        run: |
          PKG_DIR="sdk/package/luci-app-qmodem-failover"
          echo "=== Bersihkan dan Buat Folder Paket ==="
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          echo "=== Menyalin File Sumber ==="
          cp    plugin/Makefile  "$PKG_DIR/"
          cp -r plugin/src       "$PKG_DIR/"
          cp -r plugin/luasrc    "$PKG_DIR/"
          cp -r plugin/htdocs    "$PKG_DIR/"
          cp -r plugin/po        "$PKG_DIR/"
          echo "=== Validasi Folder Paket ==="
          ls -la "$PKG_DIR/"
          if ls "$PKG_DIR/" | grep -q "^sdk$"; then
            echo "❌ Terdeteksi folder sdk bersarang, batalkan!"
            exit 1
          fi
          echo "✅ Folder paket aman"

      - name: Update feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and compile
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_luci-app-qmodem-failover=m" > .config
          make defconfig 2>&1 | tail -5
          echo "=== Memulai Proses Kompilasi ==="
          make package/luci-app-qmodem-failover/compile \
            V=s -j$(nproc) 2>&1 | tail -30
          echo "=== Mencari File IPK ==="
          find bin/ -name "*qmodem*.ipk" -ls
          find bin/ -name "*qmodem*.ipk" | grep -q . \
            && echo "✅ Kompilasi Berhasil" \
            || { echo "❌ File IPK Tidak Ditemukan"; exit 1; }

      - name: Collect IPK
        run: |
          mkdir -p output
          find sdk/bin -name "*qmodem*.ipk" \
            -exec cp {} output/ \;
          echo "=== Riwayat File Output ==="
          ls -lah output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/*.ipk
          retention-days: 30

  release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          pattern: ipk-*

      - name: Collect IPKs
        run: |
          mkdir -p release-files
          find all-ipks -name "*.ipk" -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.ipk
          tag_name: v${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          body: |
            ## Cara Instalasi di Router / STB
            ```bash
            scp luci-app-qmodem-failover_*_all.ipk root@192.168.1.1:/tmp/
            opkg update
            opkg install /tmp/luci-app-qmodem-failover_*_all.ipk
            ```
            ## Kompatibilitas Perangkat (OpenWrt 23.05.3)
            - **x86_64** (PC / Mini PC / Router X86 / Proxmox)
            - **ARM64 Amlogic** (STB TV Box HG680P, B860H, dll.)
            - **MIPS mt7621** (Xiaomi, Redmi, Phicomm)
            - **MIPS ath79** (TP-Link, Huawei)
            - **ARM mt7622** (Xiaomi AX Series)
            
            > Catatan: Karena paket ini menggunakan sistem kustomisasi `PKGARCH=all`, file `.ipk` yang dihasilkan bersifat universal untuk seluruh arsitektur di atas.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
