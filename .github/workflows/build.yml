name: Build & Release IPK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    name: Shell Script Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            src/qmodem-failover.sh \
            src/wan-checker.sh \
            src/switcher.sh \
            src/notify.sh \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045
          shellcheck \
            src/qmodem-failover.init \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045

  build:
    name: Build (${{ matrix.target }}-${{ matrix.subtarget }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            subtarget: 64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: ramips
            subtarget: mt7621
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7621/openwrt-sdk-23.05.3-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: ath79
            subtarget: generic
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ath79/generic/openwrt-sdk-23.05.3-ath79-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: mediatek
            subtarget: mt7622
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/mediatek/mt7622/openwrt-sdk-23.05.3-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            python3 \
            wget \
            curl

      - name: Download and extract SDK
        run: |
          wget -q --show-progress \
            "${{ matrix.sdk_url }}" \
            -O sdk.tar.xz
          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm sdk.tar.xz
          echo "=== SDK目录结构 ==="
          ls sdk/

      - name: Copy plugin into SDK packages
        run: |
          PKG_DIR="sdk/package/luci-app-qmodem-failover"
          echo "=== 清空并创建插件目录 ==="
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          echo "=== 复制文件 ==="
          cp    plugin/Makefile  "$PKG_DIR/"
          cp -r plugin/src       "$PKG_DIR/"
          cp -r plugin/luasrc    "$PKG_DIR/"
          cp -r plugin/htdocs    "$PKG_DIR/"
          cp -r plugin/po        "$PKG_DIR/"
          echo "=== 验证插件目录（不能包含sdk子目录）==="
          ls -la "$PKG_DIR/"
          if ls "$PKG_DIR/" | grep -q "^sdk$"; then
            echo "❌ 发现sdk子目录，中止！"
            exit 1
          fi
          echo "✅ 插件目录干净"

      - name: Update feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and compile
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_luci-app-qmodem-failover=m" > .config
          make defconfig 2>&1 | tail -5
          echo "=== 开始编译插件 ==="
          make package/luci-app-qmodem-failover/compile \
            V=s -j$(nproc) 2>&1 | tail -30
          echo "=== 查找IPK ==="
          find bin/ -name "*qmodem*.ipk" -ls
          find bin/ -name "*qmodem*.ipk" | grep -q . \
            && echo "✅ 编译成功" \
            || { echo "❌ IPK未找到"; exit 1; }

      - name: Collect IPK
        run: |
          mkdir -p output
          find sdk/bin -name "*qmodem*.ipk" \
            -exec cp {} output/ \;
          echo "=== 输出文件 ==="
          ls -lah output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/*.ipk
          retention-days: 30

  release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          pattern: ipk-*

      - name: Collect IPKs
        run: |
          mkdir -p release-files
          find all-ipks -name "*.ipk" | head -1 \
            | xargs -I{} cp {} release-files/
          ls -lah release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.ipk
          body: |
            ## 安装方法
            ```bash
            scp luci-app-qmodem-failover_*_all.ipk root@192.168.1.1:/tmp/
            opkg update
            opkg install /tmp/luci-app-qmodem-failover_*_all.ipk
            ```
            ## 兼容平台
            - x86_64 软路由
            - MIPS mt7621 小米/红米/斐讯
            - MIPS ath79 TP-Link/华为
            - ARM mt7622 小米AX系列
            > PKGARCH=all 一个IPK全平台通用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
