name: Build & Release IPK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [created]

# Mengizinkan akun hasil fork Anda membuat halaman rilis otomatis
permissions:
  contents: write

jobs:
  lint:
    name: Uji Validasi Skrip (Shell Lint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Menjalankan Lint pada Skrip Shell
        run: |
          shellcheck \
            src/qmodem-failover.sh \
            src/wan-checker.sh \
            src/switcher.sh \
            src/notify.sh \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045
          shellcheck \
            src/qmodem-failover.init \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045

  build:
    name: Build (${{ matrix.target }}-${{ matrix.subtarget }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          # Target 1: x86 (64-bit) untuk PC / Mini PC / Proxmox
          - target: x86
            subtarget: 64
            sdk_url: https://downloads.openwrt.org/releases/24.10.7/targets/x86/64/openwrt-sdk-24.10.7-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            
          # Target 2: ARM64 STB Amlogic (HG680P, B860H, dll.)
          - target: meson
            subtarget: generic
            sdk_url: https://downloads.openwrt.org/releases/24.10.7/targets/armsr/armv8/openwrt-sdk-24.10.7-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Mengunduh Sumber Repositori (Checkout)
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Memasang Dependensi Linux & Alat Ekstraksi ZSTD
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            python3 \
            wget \
            curl \
            zstd

      - name: Mengunduh dan Mengekstrak SDK OpenWrt (.tar.zst)
        run: |
          wget -q --show-progress \
            "${{ matrix.sdk_url }}" \
            -O sdk.tar.zst
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst
          echo "=== Struktur Direktori SDK Berhasil Dibuat ==="
          ls sdk/

      - name: Menyalin Paket ke Dalam Sistem Kompilasi SDK
        run: |
          PKG_DIR="sdk/package/luci-app-qmodem-failover"
          echo "=== Bersihkan dan Buat Folder Paket ==="
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          echo "=== Proses Menyalin File Sumber ==="
          cp    plugin/Makefile  "$PKG_DIR/"
          cp -r plugin/src       "$PKG_DIR/"
          cp -r plugin/luasrc    "$PKG_DIR/"
          cp -r plugin/htdocs    "$PKG_DIR/"
          cp -r plugin/po        "$PKG_DIR/"
          echo "=== Validasi Folder Paket ==="
          ls -la "$PKG_DIR/"
          if ls "$PKG_DIR/" | grep -q "^sdk$"; then
            echo "❌ Terdeteksi folder sdk bersarang, batalkan!"
            exit 1
          fi
          echo "✅ Folder paket dinyatakan bersih"

      - name: Memperbarui Feed Paket SDK
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfigurasi dan Mulai Kompilasi IPK
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_luci-app-qmodem-failover=m" > .config
          make defconfig 2>&1 | tail -5
          echo "=== Memulai Proses Kompilasi Aplikasi ==="
          make package/luci-app-qmodem-failover/compile \
            V=s -j$(nproc) 2>&1 | tail -30
          echo "=== Mencari File Hasil Rilis (.ipk) ==="
          find bin/ -name "*qmodem*.ipk" -ls
          find bin/ -name "*qmodem*.ipk" | grep -q . \
            && echo "✅ Kompilasi Paket Berhasil!" \
            || { echo "❌ File IPK Tidak Ditemukan!"; exit 1; }

      - name: Mengumpulkan File Hasil Build
        run: |
          mkdir -p output
          find sdk/bin -name "*qmodem*.ipk" \
            -exec cp {} output/ \;
          echo "=== Daftar File Output ==="
          ls -lah output/

      - name: Mengunggah File ke Menu Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/*.ipk
          retention-days: 30

  release:
    name: Membuat Halaman Rilis Publik (Publish)
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Mengunduh Seluruh Hasil Kompilasi Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          pattern: ipk-*

      - name: Menyatukan File IPK
        run: |
          mkdir -p release-files
          find all-ipks -name "*.ipk" -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Mengunggah File ke Halaman Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.ipk
          tag_name: v${{ github.run_number }}
          name: Rilis Resmi Paket v${{ github.run_number }}
          body: |
            ## Cara Instalasi di Router / STB Anda
            ```bash
            scp luci-app-qmodem-failover_*_all.ipk root@192.168.1.1:/tmp/
            opkg update
            opkg install /tmp/luci-app-qmodem-failover_*_all.ipk
            ```
            ## Kompatibilitas Sistem (Dikompilasi via SDK 24.10.7 Terbaru)
            - **x86_64** (PC / Mini PC / Router X86 / Proxmox)
            - **ARM64 Amlogic** (STB TV Box HG680P, B860H, dll.)
            
            > Catatan: Paket ini menggunakan arsitektur `PKGARCH=all`, sehingga file `.ipk` yang dihasilkan bersifat universal untuk seluruh perangkat di atas.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
