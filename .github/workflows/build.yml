name: Build & Release IPK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    name: Shell Script Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            src/qmodem-failover.sh \
            src/wan-checker.sh \
            src/switcher.sh \
            src/notify.sh \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045
          shellcheck \
            src/qmodem-failover.init \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045

  build:
    name: Build (${{ matrix.target }}-${{ matrix.subtarget }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            subtarget: 64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: ramips
            subtarget: mt7621
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7621/openwrt-sdk-23.05.3-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: ath79
            subtarget: generic
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ath79/generic/openwrt-sdk-23.05.3-ath79-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - target: mediatek
            subtarget: mt7622
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/mediatek/mt7622/openwrt-sdk-23.05.3-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            python3 \
            wget \
            curl

      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ matrix.target }}-${{ matrix.subtarget }}-23.05.3

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p sdk
          wget -q --show-progress \
            "${{ matrix.sdk_url }}" \
            -O sdk.tar.xz
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm sdk.tar.xz

      - name: Setup SDK feeds
        run: |
          cd sdk
          cat feeds.conf.default || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy plugin into SDK
        run: |
          mkdir -p sdk/package/luci-app-qmodem-failover
          rsync -a --exclude='.git' --exclude='.github' \
            ./ sdk/package/luci-app-qmodem-failover/

      - name: Compile plugin
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_luci-app-qmodem-failover=m" >> .config
          make defconfig
          make package/luci-app-qmodem-failover/compile \
            -j$(nproc) V=s 2>&1 | tail -20
          find bin/ -name "*qmodem-failover*.ipk" | grep -q . \
            && echo "✅ IPK生成成功" \
            || { echo "❌ IPK未生成"; exit 1; }

      - name: Collect IPK
        run: |
          mkdir -p output
          find sdk/bin -name "*qmodem-failover*.ipk" \
            -exec cp {} output/ \;
          echo "=== 生成的IPK文件 ==="
          ls -lah output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/*.ipk
          retention-days: 30

  release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          pattern: ipk-*

      - name: Collect IPKs
        run: |
          mkdir -p release-files
          find all-ipks -name "*.ipk" | head -1 \
            | xargs -I{} cp {} release-files/
          ls -lah release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.ipk
          body: |
            ## 安装方法
            ```bash
            # 上传到路由器
            scp luci-app-qmodem-failover_*_all.ipk root@192.168.1.1:/tmp/
            # 路由器上安装
            opkg update
            opkg install /tmp/luci-app-qmodem-failover_*_all.ipk
            ```
            ## 兼容平台
            - x86_64 软路由
            - MIPS mt7621 小米/红米/斐讯
            - MIPS ath79 TP-Link/华为
            - ARM mt7622 小米AX系列
            > PKGARCH=all，一个IPK全平台通用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
