name: Build & Release IPK

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    name: Shell Script Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            src/qmodem-failover.sh \
            src/wan-checker.sh \
            src/switcher.sh \
            src/notify.sh \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045
          shellcheck \
            src/qmodem-failover.init \
            --shell=dash \
            --severity=warning \
            --exclude=SC1091,SC2034,SC3045

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            subtarget: generic
            config: |
              CONFIG_TARGET_x86=y
              CONFIG_TARGET_x86_64=y

          - target: ramips
            subtarget: mt7621
            config: |
              CONFIG_TARGET_ramips=y
              CONFIG_TARGET_ramips_mt7621=y

          - target: ath79
            subtarget: generic
            config: |
              CONFIG_TARGET_ath79=y
              CONFIG_TARGET_ath79_generic=y

          - target: mediatek
            subtarget: mt7622
            config: |
              CONFIG_TARGET_mediatek=y
              CONFIG_TARGET_mediatek_mt7622=y

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            rsync \
            wget \
            unzip \
            python3 \
            curl \
            file

      - name: Cache LEDE toolchain
        uses: actions/cache@v4
        with:
          path: |
            lede/staging_dir/host
            lede/staging_dir/toolchain-*
          key: lede-${{ matrix.target }}-${{ matrix.subtarget }}-${{ github.sha }}
          restore-keys: |
            lede-${{ matrix.target }}-${{ matrix.subtarget }}-

      - name: Checkout Lean LEDE
        run: |
          if [ ! -d lede/.git ]; then
            git clone --depth 1 \
              https://github.com/coolsnowwolf/lede lede
          fi
        timeout-minutes: 20

      - name: Place plugin into LEDE
        run: |
          mkdir -p lede/package/lean/luci-app-qmodem-failover
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            plugin/ lede/package/lean/luci-app-qmodem-failover/

      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds update base luci packages
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -a -p packages
        timeout-minutes: 30

      - name: Configure for ${{ matrix.target }}
        working-directory: lede
        run: |
          printf '${{ matrix.config }}\n' > .config
          printf 'CONFIG_PACKAGE_luci-app-qmodem-failover=m\n' >> .config
          make defconfig
          grep -q "luci-app-qmodem-failover" .config \
            && echo "✅ 插件配置确认" \
            || { echo "❌ 插件配置丢失"; exit 1; }

      - name: Build toolchain
        working-directory: lede
        run: |
          make tools/compile -j$(nproc) V=w 2>&1 | tail -5
          make toolchain/compile -j$(nproc) V=w 2>&1 | tail -5
        timeout-minutes: 120

      - name: Compile plugin IPK
        working-directory: lede
        run: |
          make package/lean/luci-app-qmodem-failover/compile \
            -j$(nproc) V=s 2>&1 | tail -30
          find bin/ -name "*qmodem-failover*.ipk" | grep -q . \
            || { echo "❌ IPK未生成"; exit 1; }
        timeout-minutes: 30

      - name: Collect IPK
        run: |
          mkdir -p output
          find lede/bin -name "*qmodem-failover*.ipk" \
            -exec cp {} output/ \;
          ls -lah output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/*.ipk
          retention-days: 30

  release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          pattern: ipk-*

      - name: Collect IPKs
        run: |
          mkdir -p release-files
          find all-ipks -name "*.ipk" | head -1 \
            | xargs -I{} cp {} release-files/
          ls -lah release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.ipk
          body: |
            ## 安装方法
            ```bash
            scp luci-app-qmodem-failover_*_all.ipk root@192.168.1.1:/tmp/
            opkg update
            opkg install /tmp/luci-app-qmodem-failover_*_all.ipk
            ```
            ## 兼容平台
            - x86_64 软路由
            - MIPS mt7621 小米/红米/斐讯
            - MIPS ath79 TP-Link/华为
            - ARM mt7622 小米AX系列
            > PKGARCH=all，一个IPK全平台通用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
